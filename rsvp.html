<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Digital - Bautizo Fernando Antonio</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Playfair Display', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url('fondo-sobre.JPG'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        body::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.65); z-index: 1;
        }

        .card-panel {
            position: relative;
            width: 90%;
            max-width: 380px;
            background-color: rgba(255, 255, 255, 0.96);
            padding: 45px 30px;
            border-radius: 15px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.6);
            text-align: center;
            z-index: 10;
            border: 2px solid #d4af37;
        }

        .card-panel h2 { 
            font-size: 1.7rem; 
            color: #0f2c59; 
            margin-bottom: 12px; 
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        
        .card-panel p { 
            font-family: 'Montserrat', sans-serif; 
            font-size: 0.9rem; 
            color: #444; 
            margin-bottom: 25px; 
            line-height: 1.6; 
        }
        
        .input-magic {
            font-family: 'Montserrat', sans-serif;
            width: 100%; 
            padding: 14px; 
            font-size: 1.2rem; 
            text-align: center;
            border: 2px solid #e6d79c; 
            border-radius: 8px; 
            margin-bottom: 15px;
            text-transform: uppercase; 
            letter-spacing: 4px; 
            color: #0f2c59; 
            font-weight: 600;
            transition: all 0.3s;
        }
        .input-magic:focus { 
            outline: none; 
            border-color: #d4af37; 
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .btn-magic {
            font-family: 'Montserrat', sans-serif; 
            font-weight: 600; 
            font-size: 0.85rem;
            width: 100%;
            padding: 15px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer;
            background-color: #0f2c59; 
            color: white; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(15, 44, 89, 0.3);
        }
        .btn-magic:hover { 
            background-color: #1d447a; 
            box-shadow: 0 6px 20px rgba(15, 44, 89, 0.5);
        }

        #error-box {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.82rem;
            color: #ba0c2f;
            margin-top: 15px;
            font-weight: 600;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card-panel">
        <h2>Acceso Digital</h2>
        <p>Introduce tu código de acceso para abrir tu pase personalizado y confirmar tu asistencia.</p>
        
        <input type="text" id="input-codigo" class="input-magic" placeholder="EJ: XX111..." onkeypress="evaluarEnter(event)">
        <button class="btn-magic" onclick="redireccionarInvitado()">Ingresar</button>
        
        <div id="error-box">❌ Código no encontrado. Por favor, verifícalo o contáctanos.</div>
    </div>

    <script>
        // ========================================================
        // ✍️ AQUÍ ESCRIBE TU LISTA DE CÓDIGOS Y LINKS DIRECTAMENTE
        // ========================================================
        const enlacesCanva = {
            "PT013": "https://invitacion-bautizo-fagp.my.canva.site/invitacion-personal-fpt",
            "PP132": "https://invitacion-bautizo-fagp.my.canva.site/invitacion-personal-fpp",
            "PG926": "https://invitacion-bautizo-fagp.my.canva.site/invitacion-personal-fgt",
            "MG242": "https://invitacion-bautizo-fagp.my.canva.site/invitacion-personal-fmdog",
            "GT371": "https://invitacion-bautizo-fagp.my.canva.site/invitacion-personal-fgut",
            "EE407": "https://invitacion-bautizo-fagp.my.canva.site/invitacion-personal-pt",
            "AE834": "https://invitacion-bautizo-fagp.my.canva.site/invitacion-personal-famgt11",
            "MT736": "https://invitacion-bautizo-fagp.my.canva.site/invitacion-personal-fmt93",
            "BA639": "https://invitacion-bautizo-fagp.my.canva.site/invitacion-personal-brb",
            "MA570": "https://invitacion-bautizo-fagp.my.canva.site/invitacion-personal-mrn",
            "MX482": "https://invitacion-bautizo-fagp.my.canva.site/invitacion-personal-gmcl75",
            "KL719": "https://invitacion-bautizo-fagp.my.canva.site/invitacion-personal-gpe24",
            "PM092": "https://invitacion-bautizo-fagp.my.canva.site/invitaci-n-personal-pm07",
            "JW854": "https://invitacion-bautizo-fagp.my.canva.site/invitacion-personal-pv35",
            "QZ190": "https://invitacion-bautizo-fagp.my.canva.site/invitacion-personal-nz67",
            "EB642": "https://invitacion-bautizo-fagp.my.canva.site/invitacion-personal-dt47",
            "YN307": "https://invitacion-bautizo-fagp.my.canva.site/invitaci-n-personal-gt84",
            "HF521": "https://invitacion-bautizo-fagp.my.canva.site/invitaci-n-personal-ab38",
            "US813": "https://invitacion-bautizo-fagp.my.canva.site/invitaci-n-personal-zptp473",
            "CJ094": "https://invitacion-bautizo-fagp.my.canva.site/invitaci-n-personal-mtscj97",
            "GA765": "https://invitacion-bautizo-fagp.my.canva.site/invitacion-personal-pbk43",
            "TC238": "https://invitacion-bautizo-fagp.my.canva.site/invitaci-n-personal-znli104",
            "OM914": "https://invitacion-bautizo-fagp.my.canva.site/invitacion-personal-fndbtc68",
            "LX450": "https://invitacion-bautizo-fagp.my.canva.site/invitacion-personal-lbts457",
            "VR627": "https://invitacion-bautizo-fagp.my.canva.site/invitacion-personal-gbltv857",
            "BK083": "https://invitacion-bautizo-fagp.my.canva.site/invitacion-personal-paoce",
            "WP516": "https://invitacion-bautizo-fagp.my.canva.site/invitacion-personal-alnto073",
            "NJ749": "https://invitacion-bautizo-fagp.my.canva.site/invitacion-personal-aldots63"
            
        };
        // ========================================================

        function redireccionarInvitado() {
            const codigoInput = document.getElementById('input-codigo').value.trim().toUpperCase();
            const errorBox = document.getElementById('error-box');
            
            if (enlacesCanva[codigoInput]) {
                errorBox.style.display = "none";
                window.location.href = enlacesCanva[codigoInput];
            } else {
                errorBox.style.display = "block";
            }
        }

        function evaluarEnter(event) {
            if (event.key === "Enter") {
                redireccionarInvitado();
            }
        }
    </script>
</body>
</html>
