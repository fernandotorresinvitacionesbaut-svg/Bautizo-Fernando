<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitación</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #1a1a1a, #000);
  color:white;
}

/* CONTADOR */
.countdown-container{
  text-align:center;
  margin-top:80px;
}

#countdown{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:20px;
  flex-wrap:wrap;
}

.time-box{
  background: linear-gradient(145deg, #1c1c1c, #000);
  color: #fff;
  padding: 18px;
  border-radius: 14px;
  width: 85px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
  border: 1px solid rgba(255,255,255,0.08);
}

.time-box span{
  font-size:28px;
  font-weight:bold;
  display:block;
  animation: pulse 1.5s infinite;
}

.time-box p{
  margin:0;
  font-size:12px;
  opacity:0.8;
}

@keyframes pulse {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.08); opacity: 0.85; }
  100% { transform: scale(1); opacity: 1; }
}
</style>

</head>

<body>

<div class="countdown-container">
  <h2>Falta para el gran día</h2>

  <div id="countdown">
    <div class="time-box"><span id="days">0</span><p>Días</p></div>
    <div class="time-box"><span id="hours">0</span><p>Horas</p></div>
    <div class="time-box"><span id="minutes">0</span><p>Min</p></div>
    <div class="time-box"><span id="seconds">0</span><p>Seg</p></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
const eventDate = new Date("2026-09-05T15:00:00").getTime();

const countdown = setInterval(function() {

  const now = new Date().getTime();
  const distance = eventDate - now;

  const days = Math.floor(distance / (1000 * 60 * 60 * 24));
  const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
  const seconds = Math.floor((distance % (1000 * 60)) / 1000);

  document.getElementById("days").innerText = days;
  document.getElementById("hours").innerText = hours;
  document.getElementById("minutes").innerText = minutes;
  document.getElementById("seconds").innerText = seconds;

  if (distance < 0) {
    clearInterval(countdown);

    document.body.style.background = "black";
    document.getElementById("countdown").innerHTML = "🔥 ¡YA ES EL DÍA!";

    launchConfetti();
  }

}, 1000);

function launchConfetti(){
  var duration = 3 * 1000;
  var end = Date.now() + duration;

  (function frame() {
    confetti({
      particleCount: 5,
      spread: 70,
      origin: { y: 0.6 }
    });

    if (Date.now() < end) {
      requestAnimationFrame(frame);
    }
  }());
}
</script>

</body>
</html>
