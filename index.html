<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Invitación</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b3dff; /* azul eléctrico */
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* glow elegante */
    .glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(255,255,255,0.25), transparent 60%);
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%,100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.15); opacity: 0.2; }
    }

    /* 💌 sobre crema */
    .envelope {
      width: 280px;
      height: 170px;
      position: relative;
      background: #f5f0e6; /* crema */
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 25px 60px rgba(0,0,0,0.4);
      transition: transform 0.4s ease, opacity 0.6s ease;
    }

    .envelope:hover {
      transform: scale(1.05);
    }

    /* solapa */
    .flap {
      position: absolute;
      top: 0;
      width: 0;
      height: 0;
      border-left: 140px solid transparent;
      border-right: 140px solid transparent;
      border-bottom: 95px solid #e8dcc9;
    }

    .text {
      position: absolute;
      bottom: 18px;
      width: 100%;
      text-align: center;
      color: #1a1a1a;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* estado abierto */
    .open {
      transform: translateY(-30px) scale(1.2);
      opacity: 0;
    }

  </style>
</head>

<body>

  <div class="glow"></div>

  <!-- 🎵 música -->
  <audio id="music" loop>
    <source src="musica.mp3" type="audio/mp3">
  </audio>

  <!-- 💌 sobre -->
  <div class="envelope" id="env" onclick="openInvite()">
    <div class="flap"></div>
    <div class="text">Toca para abrir 💌</div>
  </div>

  <script>
    let opened = false;

    function openInvite() {
      if (opened) return;
      opened = true;

      // música
      const music = document.getElementById("music");
      music.play().catch(() => {
        document.addEventListener("click", () => music.play(), { once: true });
      });

      // animación
      document.getElementById("env").classList.add("open");

      // redirección
      setTimeout(() => {
        window.location.href = "invitacion.html";
      }, 900);
    }
  </script>

</body>
</html>
