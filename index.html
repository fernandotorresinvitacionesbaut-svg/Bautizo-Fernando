<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitación</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #1a1a1a, #000);
  color:white;
  text-align:center;
}

/* CONTADOR */
#countdown{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:60px;
  flex-wrap:wrap;
}

.time-box{
  background: linear-gradient(145deg, #1c1c1c, #000);
  padding:18px;
  border-radius:14px;
  width:85px;
  box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

.time-box span{
  font-size:28px;
  font-weight:bold;
  display:block;
  animation:pulse 1.5s infinite;
}

.time-box p{
  margin:0;
  font-size:12px;
  opacity:0.8;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.08);}
  100%{transform:scale(1);}
}

/* MENSAJE FINAL */
.event-message{
  font-size:34px;
  font-weight:bold;
  animation:pop 1s infinite alternate;
}

.event-message span{
  display:block;
  font-size:18px;
  margin-top:10px;
  opacity:0.8;
}

@keyframes pop{
  from{transform:scale(1);}
  to{transform:scale(1.08);}
}
</style>

</head>

<body>

<h2>Falta para el gran día</h2>

<div id="countdown">
  <div class="time-box"><span id="days">0</span><p>Días</p></div>
  <div class="time-box"><span id="hours">0</span><p>Horas</p></div>
  <div class="time-box"><span id="minutes">0</span><p>Min</p></div>
  <div class="time-box"><span id="seconds">0</span><p>Seg</p></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

const eventDate = new Date("2026-09-05T15:00:00").getTime();

function updateCountdown() {

  const now = new Date().getTime();

  const distance = eventDate - now;

  if (distance <= 0) {

    document.body.style.background = "black";

    document.getElementById("countdown").innerHTML = `

      <div class="event-message">

        🎉 ES AHORA 🎉

        <span>Disfruta la fiesta</span>

      </div>

    `;

    launchConfetti();

    return;

  }

  const days = Math.floor(distance / (1000 * 60 * 60 * 24));

  const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

  const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));

  const seconds = Math.floor((distance % (1000 * 60)) / 1000);

  document.getElementById("days").innerText = days;

  document.getElementById("hours").innerText = hours;

  document.getElementById("minutes").innerText = minutes;

  document.getElementById("seconds").innerText = seconds;

}

// 👇 evita el “0 al cargar”

updateCountdown();

setInterval(updateCountdown, 1000);

function launchConfetti(){

  var end = Date.now() + 4000;

  (function frame() {

    confetti({

      particleCount: 6,

      spread: 80,

      origin: { y: 0.6 }

    });

    if (Date.now() < end) {

      requestAnimationFrame(frame);

    }

  }());

}

</script>

</body>
</html>
