<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Invitación</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#ffffff;
  font-family: Arial, sans-serif;
  overflow:hidden;
}

/* fondo suave */
.glow{
  position:absolute;
  width:500px;
  height:500px;
  background: radial-gradient(circle, rgba(0,0,0,0.05), transparent 60%);
  animation: float 5s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:scale(1);opacity:0.2;}
  50%{transform:scale(1.1);opacity:0.1;}
}

/* textos */
.title{
  position:absolute;
  top:30px;
  width:100%;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  color:#333;
  animation: fadeIn 1.2s ease;
}

.subtitle{
  position:absolute;
  top:60px;
  width:100%;
  text-align:center;
  font-size:16px;
  color:#666;
  animation: fadeIn 1.6s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(-10px);}
  to{opacity:1; transform:translateY(0);}
}

/* sobre */
.envelope{
  width:320px;
  height:200px;
  background:#f5f0e6;
  border-radius:14px;
  position:relative;
  cursor:pointer;
  box-shadow:0 25px 70px rgba(0,0,0,0.15);
  transition:0.6s ease;
  overflow:hidden;
}

/* solapa */
.flap{
  position:absolute;
  top:0;
  width:0;
  height:0;
  border-left:160px solid transparent;
  border-right:160px solid transparent;
  border-bottom:110px solid #e8dcc9;
  transition:0.6s ease;
}

/* carta */
.card{
  position:absolute;
  width:280px;
  height:170px;
  background:white;
  border-radius:10px;
  top:20px;
  left:20px;
  transform:translateY(140px);
  transition:0.8s ease;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

/* texto dentro */
.text{
  position:absolute;
  bottom:15px;
  width:100%;
  text-align:center;
  font-weight:bold;
  color:#1a1a1a;
}

/* abierto */
.open .card{
  transform:translateY(-80px);
}

.open .flap{
  opacity:0;
  transform:rotateX(180deg);
}

.open{
  transform:scale(1.05);
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="title">Abre esta invitación 💌</div>
<div class="subtitle">Bautizo Fernando Antonio</div>

<audio id="music" loop>
  <source src="musica.mp3" type="audio/mp3">
</audio>

<div class="envelope" id="env" onclick="openInvite()">
  <div class="flap"></div>
  <div class="card">🎉 Invitación lista</div>
  <div class="text">Toca para abrir</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
let opened = false;

function openInvite(){
  if(opened) return;
  opened = true;

  const env = document.getElementById("env");

  // 🎵 música
  const music = document.getElementById("music");
  music.play().catch(()=>{
    document.addEventListener("click", ()=>music.play(), {once:true});
  });

  // 💌 abrir sobre
  env.classList.add("open");

  // 🎉 confeti
  confetti({
    particleCount: 180,
    spread: 90,
    origin: { y: 0.6 }
  });

  setTimeout(()=>{
    confetti({
      particleCount: 100,
      spread: 70,
      origin: { y: 0.5 }
    });
  }, 400);

  // 🔗 redirección a Canva
  setTimeout(()=>{
    window.location.href =
      "https://invitacion-bautizo-fagp.my.canva.site/";
  }, 2200);
}
</script>

</body>
</html>
