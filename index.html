<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Invitación</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#ffffff;
  font-family: Arial, sans-serif;
  overflow:hidden;
}

/* contenedor */
.container{
  text-align:center;
  animation: fadeIn 1s ease;
}

/* sobre */
.envelope{
  width:280px;
  height:170px;
  background:#f3f3f3;
  border-radius:12px;
  margin:auto;
  position:relative;
  cursor:pointer;
  box-shadow:0 20px 50px rgba(0,0,0,0.15);
  transition:0.3s;
}

.envelope:hover{
  transform:scale(1.05);
}

/* solapa */
.flap{
  position:absolute;
  top:0;
  width:0;
  height:0;
  border-left:140px solid transparent;
  border-right:140px solid transparent;
  border-bottom:90px solid #e0e0e0;
}

/* texto principal */
.title{
  margin-top:20px;
  font-size:18px;
  font-weight:bold;
  opacity:0;
  transform:translateY(20px);
  animation: slideUp 1.2s forwards;
}

/* subtexto */
.subtitle{
  margin-top:10px;
  color:#444;
  opacity:0;
  transform:translateY(20px);
  animation: slideUp 1.5s forwards;
}

/* animaciones */
@keyframes slideUp{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}
</style>
</head>

<body>

<audio id="music" loop>
  <source src="musica.mp3" type="audio/mp3">
</audio>

<div class="container" onclick="openInvite()">

  <div class="envelope">
    <div class="flap"></div>
  </div>

  <div class="title">Abre esta invitación 💌</div>
  <div class="subtitle">Bautizo Fernando Antonio</div>

</div>

<script>
let opened = false;

function openInvite(){
  if(opened) return;
  opened = true;

  // música
  const music = document.getElementById("music");
  music.play().catch(()=>{
    document.addEventListener("click", ()=>music.play(), {once:true});
  });

  // redirección a Canva
  setTimeout(()=>{
    window.location.href =
      "https://invitacion-bautizo-fagp.my.canva.site/";
  }, 1500);
}
</script>

</body>
</html>
