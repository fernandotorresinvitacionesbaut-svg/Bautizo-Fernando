<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Invitación</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: radial-gradient(circle at top, #0b3dff, #0626a8);
  font-family: Arial, sans-serif;
  overflow:hidden;
}

/* glow fondo */
.glow{
  position:absolute;
  width:500px;
  height:500px;
  background: radial-gradient(circle, rgba(255,255,255,0.25), transparent 60%);
  animation: float 5s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:scale(1);opacity:0.3;}
  50%{transform:scale(1.2);opacity:0.15;}
}

/* sobre */
.envelope{
  width:320px;
  height:200px;
  background:#f5f0e6;
  border-radius:14px;
  position:relative;
  cursor:pointer;
  box-shadow:0 30px 80px rgba(0,0,0,0.5);
  overflow:hidden;
  transition:0.6s ease;
}

/* solapa */
.flap{
  position:absolute;
  top:0;
  width:0;
  height:0;
  border-left:160px solid transparent;
  border-right:160px solid transparent;
  border-bottom:110px solid #e8dcc9;
  transition:0.6s ease;
}

/* carta */
.card{
  position:absolute;
  width:280px;
  height:170px;
  background:white;
  border-radius:10px;
  top:20px;
  left:20px;
  transform:translateY(130px);
  transition:0.8s ease;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

/* texto */
.text{
  position:absolute;
  bottom:15px;
  width:100%;
  text-align:center;
  font-weight:bold;
  color:#1a1a1a;
}

/* estado abierto */
.open .card{
  transform:translateY(-70px);
}

.open .flap{
  opacity:0;
  transform:rotateX(180deg);
}

.open{
  transform:scale(1.05);
}

/* animación entrada */
.title{
  position:absolute;
  top:20px;
  width:100%;
  text-align:center;
  color:white;
  font-weight:bold;
  opacity:0;
  animation:fadeIn 1.5s forwards;
}

@keyframes fadeIn{
  to{opacity:1;}
}

/* confeti canvas */
canvas{
  position:absolute;
  top:0;
  left:0;
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="title">Abre esta invitación 💌</div>

<audio id="music" loop>
  <source src="musica.mp3" type="audio/mp3">
</audio>

<div class="envelope" id="env" onclick="openInvite()">
  <div class="flap"></div>
  <div class="card">🎉 Invitación lista</div>
  <div class="text">Toca para abrir</div>
</div>

<canvas id="confetti"></canvas>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
let opened = false;

function openInvite(){
  if(opened) return;
  opened = true;

  const env = document.getElementById("env");

  // música
  const music = document.getElementById("music");
  music.play().catch(()=>{
    document.addEventListener("click", ()=>music.play(), {once:true});
  });

  // abrir sobre
  env.classList.add("open");

  // confeti
  confetti({
    particleCount: 200,
    spread: 90,
    origin: { y: 0.6 }
  });

  // segunda explosión
  setTimeout(()=>{
    confetti({
      particleCount: 120,
      spread: 70,
      origin: { y: 0.5 }
    });
  }, 400);

  // redirección a Canva
  setTimeout(()=>{
    window.location.href =
      "https://invitacion-bautizo-fagp.my.canva.site/";
  }, 2500);
}
</script>

</body>
</html>
