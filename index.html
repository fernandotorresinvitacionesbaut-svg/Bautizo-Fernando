<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación Digital - Bautizo Fernando Antonio</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
    
    <!-- Librería para los brillos -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Playfair Display', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url('fondo-sobre.JPG'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            overflow: hidden;
        }

        body::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6); z-index: -1;
        }

        /* Contenedor del sobre con proporciones reales */
        .envelope-container {
            position: relative;
            width: 340px;
            height: 250px;
            cursor: pointer;
            margin-top: 50px;
        }

        /* Fondo del sobre */
        .envelope-base {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #f3e5ab;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            z-index: 1;
        }

        /* LA TARJETA INTERIOR (Mickey) */
        .card {
            position: absolute;
            bottom: 10px; left: 5%;
            width: 90%; height: 220px;
            background-image: url('preview.jpg'); 
            background-size: cover;
            background-position: center;
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            z-index: 2; /* Por detrás de las tapas delanteras */
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Botón de Canva */
        .btn-ver {
            background-color: rgba(186, 12, 47, 0.95); 
            color: #ffffff;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 12px 24px;
            border-radius: 4px;
            opacity: 0; 
            pointer-events: none;
            transition: all 0.4s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            letter-spacing: 1px;
            white-space: nowrap;
        }

        /* PANEL INFERIOR DELANTERO */
        .bottom-panel {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 110px;
            background-color: #e6d79c; 
            border-radius: 0 0 4px 4px;
            z-index: 4; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        .text-bautizo { color: #2b2008; font-size: 1.15rem; font-style: italic; }
        .text-invitado { font-family: 'Montserrat', sans-serif; color: #574419; font-size: 0.8rem; margin-top: 4px; text-transform: uppercase; }

        /* TRIÁNGULO CERRADO (Apunta hacia abajo) */
        .flap-closed {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 145px;
            background-color: #f3e5ab;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            z-index: 5; 
            transition: opacity 0.3s ease;
        }

        /* EL CORAZÓN AZUL */
        .heart {
            position: absolute;
            bottom: -5px; left: 50%;
            transform: translateX(-50%);
            width: 26px; height: 26px;
            background-color: #0f2c59; 
            clip-path: path('M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z');
            z-index: 6;
            transition: opacity 0.2s ease;
        }

        /* TRIÁNGULO ABIERTO (Apunta hacia arriba - Oculto al inicio) */
        .flap-open {
            position: absolute;
            bottom: 250px; left: 0;
            width: 100%; height: 145px;
            background-color: #f3e5ab;
            clip-path: polygon(50% 0, 100% 100%, 0 100%);
            z-index: 1; /* Se queda atrás de la tarjeta */
            opacity: 0;
            transition: opacity 0.4s ease 0.2s; /* Aparece con un ligero retraso mágico */
        }

        /* ========================================================
           ESTADOS CUANDO EL SOBRE SE ABRE
           ======================================================== */

        /* Desaparece la tapa de enfrente y el corazón */
        .envelope-container.open .flap-closed,
        .envelope-container.open .heart {
            opacity: 0;
            pointer-events: none;
        }

        /* Aparece la tapa trasera abierta apuntando hacia arriba */
        .envelope-container.open .flap-open {
            opacity: 1;
        }

        /* La tarjeta de Mickey se eleva limpiamente hacia arriba */
        .envelope-container.open .card {
            transform: translateY(-140px);
        }

        /* El botón se vuelve visible */
        .envelope-container.open .btn-ver {
            opacity: 1;
            pointer-events: auto;
        }
        
        .btn-ver:hover {
            background-color: rgba(186, 12, 47, 1);
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- REPRODUCTOR DE AUDIO -->
    <audio id="musicaDisney" preload="auto">
        <source src="música.mp3.m4a" type="audio/mpeg">
    </audio>

    <div class="envelope-container" id="sobre" onclick="abrirSobre()">
        
        <!-- Tarjeta interna -->
        <div class="card">
            <a href="https://invitacion-bautizo-fagp.my.canva.site" class="btn-ver" onclick="detenerPropagacion(event)">Ver Invitación</a>
        </div>

        <!-- Base y fondos del sobre -->
        <div class="envelope-base"></div>
        <div class="flap-open"></div>

        <!-- Tapa delantera que se esconde al abrir -->
        <div class="flap-closed">
            <div class="heart"></div>
        </div>

                <!-- Tapa inferior fija con el texto nuevo -->
        <div class="bottom-panel" style="height: 115px; padding: 10px; text-align: center;">
            <div class="text-bautizo" style="font-size: 0.95rem; margin-bottom: 2px;">¡Te esperamos para celebrar el bautizo de</div>
            <div class="text-bautizo" style="font-size: 1.2rem; font-weight: 600; font-style: normal; color: #0f2c59;">Fernando Guzman Perez!</div>
            <div class="text-invitado" id="txt-invitado" style="margin-top: 6px;"></div>
        </div>

    </div>

    <script>
        let sobreAbierto = false;
        const coloresDisney = ['#d4af37', '#0f2c59', '#ffffff', '#f3e5ab'];

        // Brillos ligeros al cargar la página
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                confetti({
                    particleCount: 60,
                    spread: 50,
                    origin: { y: 0.7 },
                    colors: coloresDisney
                });
            }, 600);

            const params = new URLSearchParams(window.location.search);
            const invitado = params.get('invitado');
            if (invitado) {
                document.getElementById('txt-invitado').innerText = `Para: ${invitado}`;
            }
        });

        // Evento principal para abrir el sobre
        function abrirSobre() {
            if (sobreAbierto) return; 
            sobreAbierto = true;
            
            document.getElementById('sobre').classList.add('open');
            
            // Forzar reproducción de música
            const audio = document.getElementById('musicaDisney');
            if (audio) {
                audio.currentTime = 0; // Reinicia el audio por si acaso
                audio.play().catch(error => {
                    console.log("Interacción bloqueada o archivo no encontrado:", error);
                });
            }

            // Gran lluvia de brillos de gala
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.6 },
                colors: coloresDisney,
                gravity: 0.9,
                scalar: 1.1
            });
        }

        function detenerPropagacion(event) {
            event.stopPropagation();
        }
    </script>

</body>
</html>
