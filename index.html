<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación Digital - Bautizo Fernando Antonio</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
    
    <!-- Librería para el confeti/brillos -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Playfair Display', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        
            background-image: url('fondo-sobre.JPG'); 
            
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            overflow: hidden;
        }

        body::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6); z-index: -1;
        }

        .envelope-container {
            position: relative;
            width: 340px;
            height: 400px;
            cursor: pointer;
        }

        .envelope-base {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 250px;
            background-color: #f3e5ab;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            z-index: 1;
        }

        /* LA TARJETA INTERIOR (Estrategia Invisible al inicio para que no se asome) */
        .card {
            position: absolute;
            bottom: 60px; left: 5%;
            width: 90%; height: 220px;
            background-image: url('preview.jpg'); 
            background-size: cover;
            background-position: center;
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            z-index: 2; 
            display: flex;
            justify-content: center;
            align-items: center;
            
            /* Corrección aquí: 100% invisible y ligeramente encogida adentro */
            opacity: 0;
            transform: scale(0.85) translateY(30px); 
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease;
        }

        .btn-ver {
            background-color: rgba(186, 12, 47, 0.9); 
            color: #ffffff;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 12px 24px;
            border-radius: 4px;
            opacity: 0; 
            pointer-events: none;
            transition: all 0.4s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            letter-spacing: 1px;
        }

        .bottom-panel {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 95px;
            background-color: #e6d79c; 
            border-radius: 0 0 12px 12px;
            z-index: 4; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        .text-bautizo {
            color: #2b2008;
            font-size: 1.15rem;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        .text-invitado {
            font-family: 'Montserrat', sans-serif;
            color: #574419;
            font-size: 0.8rem;
            margin-top: 4px;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .flap {
            position: absolute;
            top: 150px; left: 0;
            width: 100%; height: 155px;
            background-color: #f3e5ab;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            z-index: 5; 
            transition: all 0.5s ease-in-out;
        }

        .heart {
            position: absolute;
            top: 290px; left: 50%;
            transform: translateX(-50%);
            width: 28px; height: 28px;
            background-color: #0f2c59; 
            clip-path: path('M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z');
            z-index: 6;
            transition: all 0.4s ease;
        }

        /* SOBRE ABIERTO */
        .envelope-container.open .flap {
            top: -5px;
            height: 155px;
            clip-path: polygon(50% 0, 100% 100%, 0 100%);
            z-index: 2; 
        }

        .envelope-container.open .heart {
            opacity: 0;
            transform: translateX(-50%) translateY(-40px) scale(0.5);
            pointer-events: none;
        }

        /* La tarjeta aparece majestuosamente sin romper el fondo */
        .envelope-container.open .card {
            opacity: 1;
            transform: scale(1) translateY(-140px);
        }

        .envelope-container.open .btn-ver {
            opacity: 1;
            pointer-events: auto;
        }
        
        .btn-ver:hover {
            background-color: rgba(186, 12, 47, 1);
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- REPRODUCTOR CON CONFIGURACIÓN DE AUDIO MÁS COMPATIBLE -->
    <audio id="musicaDisney" preload="auto">
        <source src="musica.mp3.m4a" type="audio/mpeg">
    </audio>

    <div class="envelope-container" id="sobre" onclick="abrirSobre()">
        <div class="card">
            <a href="https://invitacion-bautizo-fagp.my.canva.site" class="btn-ver" onclick="detenerPropagacion(event)">Ver Invitación</a>
        </div>
        <div class="envelope-base"></div>
        <div class="flap"></div>
        <div class="heart"></div>
        <div class="bottom-panel">
            <div class="text-bautizo">bautizo Fernando Antonio</div>
            <div class="text-invitado" id="txt-invitado"></div>
        </div>
    </div>

    <script>
        let sobreAbierto = false;
        const coloresDisney = ['#d4af37', '#0f2c59', '#ffffff', '#f3e5ab'];

        // 1. Brillos al entrar
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                confetti({
                    particleCount: 80,
                    spread: 60,
                    origin: { y: 0.7 },
                    colors: coloresDisney,
                    gravity: 1.2
                });
            }, 500);

            const params = new URLSearchParams(window.location.search);
            const invitado = params.get('invitado');
            if (invitado) {
                document.getElementById('txt-invitado').innerText = `Para: ${invitado}`;
            }
        });

        // 2. Abrir sobre, Brillos premium y Música
        function abrirSobre() {
            if (sobreAbierto) return; 
            sobreAbierto = true;
            
            document.getElementById('sobre').classList.add('open');
            
            // Intento forzado de reproducción de música
            const audio = document.getElementById('musicaDisney');
            if (audio) {
                audio.volume = 0.8; // Volumen al 80%
                audio.play().then(() => {
                    console.log("Música sonando perfectamente.");
                }).catch(error => {
                    console.log("Error al reproducir audio: ", error);
                });
            }

            // Ráfaga de gala
            confetti({
                particleCount: 180,
                spread: 90,
                origin: { y: 0.6 },
                colors: coloresDisney,
                gravity: 0.8,
                scalar: 1.2
            });
        }

        function detenerPropagacion(event) {
            event.stopPropagation();
        }
    </script>

</body>
</html>
